# Tomcat
server:
  port: 9200
# Spring
spring:
  main:
    #解决升级spring boot 2.6后，因循环引用导致启动报错问题
    allow-circular-references: true
    allow-bean-definition-overriding: true
  application:
    # 应用名称
    name: dji-business
  profiles:
    # 环境配置
    active: local
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
# 暴露所有端点
management:
  endpoints:
    web:
      exposure:
        include: '*'
# 大疆司空配置
dji:
  spatium:
    app-key: ${DJI_SPATIUM_APP_KEY:test-key}
    app-secret: ${DJI_SPATIUM_APP_SECRET:test-secret}
    host: ${DJI_SPATIUM_HOST:https://api-test.dji.com}
    # 回调校验密钥，司空后台配置的回调签名密钥
    callback-secret: ${DJI_CALLBACK_SECRET:callback-test-secret}